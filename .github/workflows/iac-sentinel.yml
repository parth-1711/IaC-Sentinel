name: "IaC Sentinel — Terraform Compliance Check"

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "policies/**"
      - ".github/workflows/iac-sentinel.yml"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  compliance-scan:
    name: "Scan Terraform Plan with OPA & AI Agent"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init & Plan
        id: tf-plan
        run: |
          if compgen -G "**/*.tf" > /dev/null; then
            # Generate plan for real terraform root if present
            terraform init -backend=false
            terraform plan -out=tfplan.binary
            terraform show -json tfplan.binary > tfplan.json
          else
            # Fallback to test fixture for PR validation
            cp tests/fixtures/bad_plan.json tfplan.json
          fi

      - name: Determine Policy Override
        id: override-check
        run: |
          # Label-based override: PRs with 'skip-iac-sentinel' or 'compliance-approved' fail-open
          HAS_OVERRIDE="${{ contains(github.event.pull_request.labels.*.name, 'skip-iac-sentinel') || contains(github.event.pull_request.labels.*.name, 'compliance-approved') }}"
          if [ "$HAS_OVERRIDE" = "true" ]; then
            echo "FAIL_ON_HIGH=false" >> $GITHUB_OUTPUT
            echo "Policy override label detected. Running in fail-open audit mode."
          else
            echo "FAIL_ON_HIGH=true" >> $GITHUB_OUTPUT
          fi

      - name: Run IaC Sentinel Action
        uses: ./github-action
        with:
          plan_file: "tfplan.json"
          policies_dir: "policies"
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          fail_on_high: ${{ steps.override-check.outputs.FAIL_ON_HIGH }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          comment_on_pr: "true"
          mongo_uri: ${{ secrets.MONGO_URI }}
