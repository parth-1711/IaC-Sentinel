name: "IaC Sentinel Compliance Agent"
description: "Evaluates Terraform plans against custom OPA policies and enriches violations with AI explanations & remediation patches."
author: "IaC Sentinel Team"

inputs:
  plan_file:
    description: "Path to the exported Terraform plan JSON file (from `terraform show -json`)"
    required: true
  policies_dir:
    description: "Path (relative to the calling repo's checkout) to a directory of custom OPA Rego policies. Leave empty to use this action's own bundled policies/ folder instead — the right default for consumer repos that don't define their own."
    required: false
    default: ""
  gemini_api_key:
    description: "Google Gemini API Key for AI explanation and remediation patch generation"
    required: false
    default: ""
  fail_on_high:
    description: "Fail the CI step if high-severity violations are detected (true/false)"
    required: false
    default: "true"
  github_token:
    description: "GitHub token for commenting on PRs and proposing remediation branches"
    required: false
    default: ${{ github.token }}
  comment_on_pr:
    description: "Post compliance report and remediation diff directly as a PR comment"
    required: false
    default: "true"
  mongo_uri:
    description: "MongoDB connection URI for persisting scan history for the dashboard (leave empty to skip DB logging)"
    required: false
    default: ""
  mongo_db_name:
    description: "MongoDB database name for persisting scan history"
    required: false
    default: "iac_sentinel"

outputs:
  compliance_score:
    description: "Overall compliance health score (0-100)"
    value: ${{ steps.scan.outputs.compliance_score }}
  violations_count:
    description: "Total number of policy violations detected"
    value: ${{ steps.scan.outputs.violations_count }}
  passed:
    description: "Whether the compliance scan passed"
    value: ${{ steps.scan.outputs.passed }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        # No pip cache: it's keyed via hashFiles(), which can only see files
        # inside the calling repo's own workspace — not this action's own
        # requirements.txt when used cross-repo via
        # `uses: owner/repo/github-action@ref`. Not worth working around for
        # the few seconds it'd save.

    - name: Set up OPA
      uses: open-policy-agent/setup-opa@v2
      with:
        version: "latest"

    - name: Install Python Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ github.action_path }}/../requirements.txt

    - name: Run IaC Sentinel Compliance Scan
      id: scan
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
      run: |
        FAIL_FLAG=""
        if [ "${{ inputs.fail_on_high }}" = "false" ]; then
          FAIL_FLAG="--no-fail-on-high"
        fi

        # `github.action_path` is only meaningful here, inside the action's
        # own step — it can't be resolved by a calling workflow, so the
        # fallback to this action's bundled policies has to happen in this
        # script rather than via the input's default value.
        POLICIES_DIR="${{ inputs.policies_dir }}"
        if [ -z "$POLICIES_DIR" ]; then
          POLICIES_DIR="${{ github.action_path }}/../policies"
        fi

        # Only persist to MongoDB when a connection URI was supplied — keeps
        # the action working with zero config for anyone who hasn't set up
        # the dashboard's audit log store.
        LOG_FLAGS="--log-db \"\""
        if [ -n "${{ inputs.mongo_uri }}" ]; then
          LOG_FLAGS="--mongo-uri \"${{ inputs.mongo_uri }}\" --log-db \"${{ inputs.mongo_db_name }}\" --repo \"${{ github.repository }}\" --commit \"${{ github.sha }}\""
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            LOG_FLAGS="$LOG_FLAGS --pr ${{ github.event.pull_request.number }}"
          fi
        fi

        python ${{ github.action_path }}/../main.py scan \
          --plan "${{ inputs.plan_file }}" \
          --policies "$POLICIES_DIR" \
          --explain \
          --remediate \
          --output-comment pr_comment.md \
          --output-json scan_result.json \
          $FAIL_FLAG \
          $LOG_FLAGS

    - name: Post or Update PR Comment
      if: ${{ inputs.comment_on_pr == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const fs = require('fs');
          if (fs.existsSync('pr_comment.md')) {
            const body = fs.readFileSync('pr_comment.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const botComment = comments.find(c => c.body.includes('IaC Sentinel — Compliance Review'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }
          }
